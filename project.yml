name: Hearth
options:
  bundleIdPrefix: com.cyan0914
  deploymentTarget:
    iOS: "16.0"
  minimumXcodeGenVersion: 2.40
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: H4VQ9X6KYK
    # 1.0.4, because 1.0.3 went on sale and closed its train. App Store Connect
    # rejects any further upload carrying 1.0.3 outright -- "The train version
    # '1.0.3' is closed for new build submissions" -- and Apple compares the
    # candidate against the last approved version, so the string has to move
    # forward, not just the build number. Bump this every time a version goes
    # live.
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    # No INFOPLIST_KEY_* settings here on purpose. They only merge into a
    # *generated* Info.plist, and the target below sets GENERATE_INFOPLIST_FILE
    # to NO with an explicit file -- so anything declared that way would be
    # silently dropped from the built app. Every Info.plist entry, including
    # ITSAppUsesNonExemptEncryption, lives in Resources/Info.plist instead.
    # The API host. A build-time value rather than a hardcoded literal, so a
    # staging build does not need a source edit.
    HEARTH_API_BASE: https://hearth.taomindapp.com/v1
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.103.2

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - ".git/"
          - ".github/"
          - "**/.gitkeep"
          - "README.md"
          - ".gitignore"
          - "上架材料/"
          - "ExportOptions.plist"
          - "Resources/Hearth.entitlements"
          # App Store Connect tooling, not app content. -- path: . sweeps the
          # whole checkout, so without this the scripts land in the bundle as
          # resources; build 45 was archived with asc_release.py, asc_fill_
          # sub_prices.py and asc_sub_review_shot.py inside Hearth.app.
          - "tools/"
          - "**/__pycache__/"
    settings:
      base:
        PRODUCT_NAME: Hearth
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.hearth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Hearth.entitlements
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEARTH_API_BASE: $(HEARTH_API_BASE)
      configs:
        Release:
          # Manual signing, scoped to this target only. A command-line
          # PROVISIONING_PROFILE_SPECIFIER would apply to every target in the
          # build graph, including SPM packages -- and a package target like
          # RevenueCat_RevenueCat rejects a manual profile outright ("does not
          # support provisioning profiles"). Declared here, the settings land in
          # Hearth's own buildSettings; dependencies stay on automatic signing.
          # The specifier value is injected at archive time (see the Archive
          # step): it names the CI-installed profile, which is not a repo value.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(HEARTH_DIST_PROFILE_SPECIFIER)
    dependencies:
      - package: RevenueCat
