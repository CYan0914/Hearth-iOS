name: Build Hearth

# Two jobs in one workflow, and that is deliberate. A compile check and an
# archive that get split across two files are two things to watch, and the
# failure mode is watching the wrong one and believing a build succeeded.
#
# The archive job only runs when create_ipa is explicitly true, so the default
# dispatch is a cheap simulator compile.

on:
  workflow_dispatch:
    inputs:
      create_ipa:
        description: 'Build a signed IPA and upload it to TestFlight'
        required: false
        default: false
        type: boolean
      screenshots:
        description: 'Capture App Store screenshots (6.9" iPhone + 13" iPad)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Compile check (the default, and what every push runs) ──────────────
  build:
    name: Build for iOS Simulator
    if: |
      github.event_name == 'push' ||
      (github.event.inputs.create_ipa != 'true' && github.event.inputs.screenshots != 'true')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (26+ required for App Store uploads)
        run: |
          echo "=== Available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          for xc in /Applications/Xcode*.app; do
            if sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null; then
              sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "unknown")
              echo "  $xc -> iOS SDK $sdk"
              if [[ "$sdk" == 2[6-9].* ]] || [[ "$sdk" == [3-9]* ]]; then
                echo "Selected: $xc (iOS SDK $sdk)"
                xcodebuild -version
                exit 0
              fi
            fi
          done
          echo "No Xcode with SDK 26+ found -- falling back"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null
          xcodegen --version

      - name: Generate Xcode project
        run: |
          # Nothing is committed to generate over, but a stale directory from a
          # cached runner would carry an older Xcode format than the one
          # selected above, and xcodebuild refuses to open it.
          rm -rf Hearth.xcodeproj
          xcodegen generate

      - name: Ensure the iOS platform is installed
        run: |
          sudo xcodebuild -license accept 2>&1 || true
          sudo xcodebuild -runFirstLaunch 2>&1 || true
          for i in 1 2 3; do
            echo "Attempt $i..."
            sudo xcodebuild -downloadPlatform iOS -quiet 2>&1 && break
            echo "Attempt $i failed, sleeping 10s..."
            sleep 10
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || echo "iphoneos SDK not found"

      - name: Build for Simulator
        run: |
          # Unsigned on purpose: this job answers "does it compile", and pulling
          # signing credentials into it would make a code error and a certificate
          # problem look the same.
          #
          # Output goes to a file rather than straight through xcpretty, because
          # xcpretty drops the body of tool errors: an actool failure came back
          # as "CompileAssetCatalogVariant ... failed" with no reason in it, and
          # the reason is the only part worth having. xcpretty still formats the
          # success path; the raw log is what gets read when something breaks.
          set +e
          xcodebuild build \
            -project Hearth.xcodeproj \
            -scheme Hearth \
            -sdk iphonesimulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          set -e

          if [ $status -ne 0 ]; then
            echo "::group::errors"
            grep -nE "error:|error :|❌|fatal" build.log | head -60 || true
            echo "::endgroup::"
            echo "::group::last 100 lines of the raw log"
            tail -100 build.log
            echo "::endgroup::"
            exit $status
          fi
          xcpretty < build.log

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 7

  # ─── Archive and upload (manual, create_ipa=true) ──────────────────────
  archive:
    name: Archive for App Store
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_ipa == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (26+ required for App Store uploads)
        run: |
          echo "=== Available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          for xc in /Applications/Xcode*.app; do
            if sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null; then
              sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "unknown")
              echo "  $xc -> iOS SDK $sdk"
              if [[ "$sdk" == 2[6-9].* ]] || [[ "$sdk" == [3-9]* ]]; then
                echo "Selected: $xc (iOS SDK $sdk)"
                xcodebuild -version
                exit 0
              fi
            fi
          done
          echo "No Xcode with SDK 26+ found -- falling back"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null
          xcodegen --version

      - name: Generate Xcode project
        run: |
          rm -rf Hearth.xcodeproj
          xcodegen generate

      - name: Ensure the iOS platform is installed
        run: |
          sudo xcodebuild -license accept 2>&1 || true
          sudo xcodebuild -runFirstLaunch 2>&1 || true
          for i in 1 2 3; do
            echo "Attempt $i..."
            sudo xcodebuild -downloadPlatform iOS -quiet 2>&1 && break
            echo "Attempt $i failed, sleeping 10s..."
            sleep 10
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || echo "iphoneos SDK not found"

      # ── Manual signing ───────────────────────────────────────────────────
      # Automatic signing cannot work from CI on this account, and the reason
      # is worth writing down because it is not the obvious one.
      #
      # Xcode 26's automatic export does not ask App Store Connect for an
      # ordinary IOS_DISTRIBUTION certificate. It asks for a
      # DISTRIBUTION_MANAGED one -- cloud-managed, key held by Apple:
      #
      #   POST appstoreconnect.apple.com/xcbuild/v1/certificates
      #        filter[certificateType]=DISTRIBUTION_MANAGED
      #   -> 403 FORBIDDEN_ERROR, resultCode 7495
      #      "You haven't been given access to cloud-managed distribution
      #       certificates."
      #
      # An API-key session is refused that endpoint, so automatic signing never
      # reaches a distribution identity, the archive falls back to a
      # development one, and the export has nothing to sign with. Freeing a
      # certificate slot does not touch it: the refusal is about permission on
      # a certificate *type*, not about the account being at a limit.
      #
      # So the identity is imported explicitly here, and both signing steps run
      # manual. The profile is written into the runner's profile directory
      # because that is where codesign looks; importing the certificate alone
      # is not enough.
      - name: Import distribution identity
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DIST_PROFILE: ${{ secrets.DIST_PROFILE }}
        run: |
          set -e
          if [ -z "$DIST_CERT_P12" ]; then
            echo "DIST_CERT_P12 is not set -- cannot sign for distribution."
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$DIST_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/hearth.mobileprovision
          echo "profile bytes: $(wc -c < ~/Library/MobileDevice/Provisioning\ Profiles/hearth.mobileprovision)"

          printf '%s' "$DIST_CERT_P12" | base64 --decode > /tmp/dist.p12
          # Both sizes, so a future failure says which layer broke. A secret
          # that arrives truncated makes the decoded file short and the import
          # blame the password; a file of the right size that still will not
          # import means the format is wrong instead.
          echo "DIST_CERT_P12: ${#DIST_CERT_P12} chars -> $(wc -c < /tmp/dist.p12) decoded bytes"
          echo "password length: ${#DIST_CERT_PASSWORD}"

          # A throwaway keychain, because a GitHub runner's default keychain is
          # not unlocked for codesign and unlocking the system one is fiddlier
          # than making a new one.
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          # -T names the tools allowed to use the key without prompting, and
          # set-key-partition-list is what stops macOS from putting up a GUI
          # prompt that nobody can answer on a headless runner. Skipping either
          # produces errSecInternalComponent at codesign time, several steps
          # later than the import.
          #
          # The p12 is built with a SHA-1 MAC and 3DES, not the PBES2/PBKDF2
          # defaults. macOS's Security framework verifies only the traditional
          # MAC and reports a mismatch as a wrong password, which is how a
          # format problem masqueraded as a bad secret for a whole run. See
          # hearth_make_p12_legacy.py.
          if ! security import /tmp/dist.p12 -k build.keychain \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild; then
            echo "::error::Could not import the distribution p12."
            echo "::group::what openssl says about the p12 it was given"
            # The password goes through a file rather than the command line,
            # because a native command's arguments are visible in the process
            # list and readable by any other process on the machine.
            printf '%s' "$DIST_CERT_PASSWORD" > /tmp/pw.txt
            openssl pkcs12 -in /tmp/dist.p12 -info -nokeys \
              -passin file:/tmp/pw.txt 2>&1 | head -20 || true
            rm -f /tmp/pw.txt
            echo "::endgroup::"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain > /dev/null
          rm -f /tmp/dist.p12

          echo "=== identities now available ==="
          security find-identity -v -p codesigning build.keychain

          # Assert it, rather than letting a later step report the absence in
          # its own words. find-identity omits identities whose chain does not
          # validate, so this also catches a p12 that imported without its
          # intermediate.
          if ! security find-identity -v -p codesigning build.keychain \
               | grep -q "Apple Distribution"; then
            echo "::error::No 'Apple Distribution' identity after import. The p12 imported but is not usable for signing."
            exit 1
          fi

      - name: Archive
        env:
          DIST_PROFILE_SPECIFIER: ${{ secrets.DIST_PROFILE_SPECIFIER }}
        run: |
          BUILD_NUM=${{ github.run_number }}
          echo "Using build number $BUILD_NUM"

          # No -allowProvisioningUpdates and no -authenticationKey*: those exist
          # to let Xcode talk to App Store Connect and create things, which is
          # the path that is forbidden above. Manual signing already has
          # everything it needs on disk.
          #
          # Both capabilities this app declares -- Sign in with Apple and push
          # -- are in the profile that was just installed, so they survive into
          # the signature.
          xcodebuild archive \
            -project Hearth.xcodeproj \
            -scheme Hearth \
            -configuration Release \
            -sdk iphoneos \
            -archivePath Hearth.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$DIST_PROFILE_SPECIFIER" \
            DEVELOPMENT_TEAM=H4VQ9X6KYK \
            CURRENT_PROJECT_VERSION="$BUILD_NUM"

          # What the archive was actually signed with, read back off the binary
          # rather than inferred from the settings above. The failure this
          # replaces was an archive signed with a *development* identity that
          # looked fine until the export could not use it.
          echo "=== archive signature ==="
          codesign -dv --verbose=4 \
            Hearth.xcarchive/Products/Applications/Hearth.app 2>&1 \
            | grep -E "Authority|Identifier|TeamIdentifier" || true
          if ! codesign -dv --verbose=4 \
               Hearth.xcarchive/Products/Applications/Hearth.app 2>&1 \
               | grep -q "Authority=Apple Distribution"; then
            echo "::error::Archive is not signed with an Apple Distribution identity."
            exit 1
          fi

      - name: Export IPA
        run: |
          # No -allowProvisioningUpdates and no authentication key here. Both
          # were removed together with automatic signing: they exist to let
          # Xcode create certificates and profiles through App Store Connect,
          # and that is precisely the endpoint that answers 403 to an API-key
          # session. The identity and the profile are already on disk.
          echo "=== code signing identities in the keychain ==="
          security find-identity -v -p codesigning

          set +e
          xcodebuild -exportArchive \
            -archivePath Hearth.xcarchive \
            -exportPath ./ipa \
            -exportOptionsPlist ExportOptions.plist \
            > export.log 2>&1
          status=$?
          set -e

          if [ $status -ne 0 ]; then
            echo "::group::export errors"
            grep -nE "error|warning: .*(profile|certificate)" export.log | head -40 || true
            echo "::endgroup::"

            # The reason lives in these. xcodebuild prints two summary lines and
            # puts the actual cause -- the exchanges with App Store Connect, which
            # certificate types it looked for and what came back -- in the
            # distribution log bundle.
            #
            # They are .log files, not .plist. An earlier version of this step
            # globbed for *.plist, found none, and so printed the file listing
            # and not one line of content -- which is why the failure stayed
            # unexplained across two runs.
            echo "::group::distribution logs"
            logs_dir="$(dirname "$(grep -o '/var/folders/[^"]*\.xcdistributionlogs' export.log | head -1)")"
            if [ -d "$logs_dir" ]; then
              for d in "$logs_dir"/*.xcdistributionlogs; do
                [ -d "$d" ] || continue
                echo "--- $d"
                find "$d" -name '*.log' -type f | sort | while IFS= read -r f; do
                  echo "=== $(basename "$f")"
                  tail -70 "$f"
                done
              done
            else
              echo "(no distribution log directory; looked in: $logs_dir)"
            fi
            echo "::endgroup::"

            echo "::group::what the export was told to do"
            cat ExportOptions.plist
            echo "::endgroup::"
            tail -40 export.log
            exit $status
          fi
          tail -20 export.log

      - name: Upload IPA as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearth-ipa
          path: ipa/Hearth.ipa
          retention-days: 30

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          xcrun altool --upload-app \
            -f "ipa/Hearth.ipa" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --type ios \
            --verbose 2>&1

  # ─── App Store screenshots (manual, screenshots=true) ─────────────────────
  #
  # App Store Connect wants a 6.9" iPhone set and a 13" iPad set. This project
  # is developed on a Windows machine with no Xcode, and the only machine that
  # can run the app is a runner: no camera, no photo library, no way to complete
  # Sign in with Apple. So the app is launched with `-HearthDemo`, which seeds a
  # fixture session from memory, and `-HearthDemoScreen`, which picks the screen
  # it opens on. Both live in Services/DemoMode.swift, entirely inside `#if
  # DEBUG`, so nothing in it compiles into the Release build that ships.
  #
  # This job does not sign, does not upload, and touches nothing the other two
  # jobs produce. It just leaves PNGs as an artifact.
  screenshots:
    name: Capture App Store screenshots
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.screenshots == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (26+ required for App Store uploads)
        run: |
          echo "=== Available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          for xc in /Applications/Xcode*.app; do
            if sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null; then
              sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "unknown")
              echo "  $xc -> iOS SDK $sdk"
              if [[ "$sdk" == 2[6-9].* ]] || [[ "$sdk" == [3-9]* ]]; then
                echo "Selected: $xc (iOS SDK $sdk)"
                xcodebuild -version
                exit 0
              fi
            fi
          done
          echo "No Xcode with SDK 26+ found -- falling back"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null
          xcodegen --version

      - name: Generate Xcode project
        run: |
          rm -rf Hearth.xcodeproj
          xcodegen generate

      - name: Ensure the iOS platform is installed
        run: |
          sudo xcodebuild -license accept 2>&1 || true
          sudo xcodebuild -runFirstLaunch 2>&1 || true
          for i in 1 2 3; do
            echo "Attempt $i..."
            sudo xcodebuild -downloadPlatform iOS -quiet 2>&1 && break
            echo "Attempt $i failed, sleeping 10s..."
            sleep 10
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || echo "iphoneos SDK not found"

      - name: Build for Simulator (Debug)
        run: |
          # Debug, not Release: `-HearthDemo` and everything it needs are inside
          # `#if DEBUG`. A Release build here would launch straight to the
          # sign-in screen and produce five identical useless PNGs.
          #
          # Output goes to a file rather than straight through xcpretty, for the
          # same reason as the compile-check job: xcpretty drops the body of tool
          # errors, and the body is the only part worth reading.
          set +e
          xcodebuild build \
            -project Hearth.xcodeproj \
            -scheme Hearth \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          set -e

          if [ $status -ne 0 ]; then
            echo "::group::errors"
            grep -nE "error:|error :|fatal" build.log | head -60 || true
            echo "::endgroup::"
            tail -100 build.log
            exit $status
          fi
          tail -5 build.log

      - name: Capture screenshots
        run: |
          set -euo pipefail

          BUNDLE_ID=com.cyan0914.hearth
          APP="build/Build/Products/Debug-iphonesimulator/Hearth.app"
          [ -d "$APP" ] || { echo "::error::No app at $APP"; exit 1; }

          command -v jq >/dev/null || brew install jq >/dev/null

          # Device *names* are stable across Xcode releases; UDIDs are not, and
          # the runtime suffix is not either. So: newest iOS runtime first, then
          # the first device whose name matches the pattern. jq's `[..][0]` is
          # used instead of `head -1` so nothing in the pipeline gets SIGPIPE,
          # which `pipefail` would turn into a failure.
          devices=$(xcrun simctl list devices available -j)
          pick() {
            printf '%s' "$devices" | jq -r --arg p "$1" '
              [ .devices | to_entries[] | select(.key | test("SimRuntime.iOS-")) ]
              | sort_by(.key) | reverse
              | [ .[].value[] | select(.name | test($p)) ][0].udid // empty'
          }

          PHONE=$(pick '^iPhone 1[0-9] Pro Max$')
          if [ -z "$PHONE" ]; then
            echo "No 'iPhone <n> Pro Max'; falling back to any Pro Max."
            PHONE=$(pick 'iPhone.*Pro Max')
          fi
          TABLET=$(pick '^iPad Pro 13-inch')
          if [ -z "$TABLET" ]; then
            echo "No 'iPad Pro 13-inch'; falling back to any 12.9-inch."
            TABLET=$(pick '^iPad Pro 12.9-inch')
          fi
          if [ -z "$PHONE" ] || [ -z "$TABLET" ]; then
            echo "::error::Could not find the simulators. Available:"
            xcrun simctl list devices available | sed -n '1,80p'
            exit 1
          fi
          echo "iPhone: $PHONE"
          echo "iPad:   $TABLET"

          # Capture order is gallery order. Today first, because the chore list
          # with something overdue in it is the product in one glance; the scan
          # confirm third, because "3 tasks scheduled" is the moment the app
          # makes its promise.
          SCREENS=(today detail scan assets recalls)

          capture() {
            local udid="$1" dir="$2" label="$3"
            mkdir -p "$dir"

            xcrun simctl bootstatus "$udid" -b

            # The status bar is overridden because a runner's clock reads like a
            # runner's clock, and every App Store screenshot set since 2008 has
            # said 9:41 for a reason.
            xcrun simctl status_bar "$udid" override \
              --time "9:41" --batteryState charged --batteryLevel 100 \
              --cellularBars 4 --wifiBars 3 2>/dev/null || true

            local n=0
            for screen in "${SCREENS[@]}"; do
              n=$((n + 1))
              local out
              out=$(printf '%s/%02d-%s.png' "$dir" "$n" "$screen")

              xcrun simctl install "$udid" "$APP"
              xcrun simctl launch "$udid" "$BUNDLE_ID" \
                -HearthDemo -HearthDemoScreen "$screen"
              # A fixed wait rather than a poll: there is nothing to poll. The
              # demo answers from memory, so the screens render in well under a
              # second and the rest of this is launch and first-frame time.
              sleep 6

              xcrun simctl io "$udid" screenshot "$out"
              xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true

              # App Store Connect decides a screenshot's display type from its
              # pixel dimensions and rejects anything it does not recognise. A
              # wrong-sized PNG found here costs one re-run; found at upload time
              # it costs a failed submission.
              local w h actual
              w=$(sips -g pixelWidth "$out" | awk '/pixelWidth/{print $2}')
              h=$(sips -g pixelHeight "$out" | awk '/pixelHeight/{print $2}')
              actual="${w}x${h}"
              # Matched with a bash case rather than `printf | grep -q`, which
              # is a race: grep exits at the first match, printf can take
              # SIGPIPE, and `pipefail` turns that into a failed step.
              case "$label" in
                iphone69) allowed="1320x2868 1290x2796" ;;
                ipad13)   allowed="2064x2752 2048x2732" ;;
              esac
              case " $allowed " in
                *" $actual "*) ;;
                *)
                  echo "::error::$out is $actual, which is not one of: $allowed"
                  exit 1
                  ;;
              esac
              echo "  $out  $actual"
            done

            xcrun simctl status_bar "$udid" clear 2>/dev/null || true
          }

          capture "$PHONE"  shots/iphone69 iphone69
          capture "$TABLET" shots/ipad13   ipad13

          echo "=== captured ==="
          find shots -name '*.png' | sort
          find shots -name '*.png' -exec du -h {} \;

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hearth-screenshots
          path: shots/
          retention-days: 30
